# Configuración del stack local de Supabase (docs/06-arquitectura-y-stack.md §7.1).
project_id = "asisteam"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
# Access token 1 h + rotación de refresh tokens (docs/07-api-y-backend.md §6.1).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Política de contraseñas (docs/11-legal-seguridad-privacidad.md §5.2):
# mínimo 10 caracteres, sin composición arbitraria. La verificación contra
# listas de contraseñas filtradas (HIBP) se habilita en el dashboard de
# Supabase en staging/producción (Auth → Passwords).
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
# MVP [P0]: sin confirmación de email — HU-GEN-01 exige quedar autenticado
# al registrarse. Se reevalúa al configurar Resend en staging/producción.
enable_confirmations = false
# HU-GEN-03: enlace de recuperación de un solo uso, válido por 60 minutos.
otp_expiry = 3600

[auth.email.template.recovery]
subject = "Restablece tu contraseña de Asisteam"
content_path = "./supabase/templates/recovery.html"

[functions.accept-invitation]
# Preview y registro usan el token de invitación; accept valida getUser en Edge.
verify_jwt = false

[functions.send-invitation]
# Edge valida getUser(JWT) y SQL repite la autorización ADMIN por grupo.
verify_jwt = false
