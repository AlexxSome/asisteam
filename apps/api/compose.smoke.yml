services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: asisteam_test
      POSTGRES_USER: asisteam_runtime
      POSTGRES_PASSWORD: synthetic-only
    ports:
      - "127.0.0.1:55466:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asisteam_runtime -d asisteam_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://asisteam_runtime:synthetic-only@postgres:5432/asisteam_test
      PG_CONNECT_TIMEOUT_MS: 500
      PG_STATEMENT_TIMEOUT_MS: 1000
    ports:
      - "127.0.0.1:30466:3001"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
